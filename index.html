<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Download MyStore — your neighbourhood kirana store, delivered." />
  <meta name="theme-color" content="#667eea" />
  <title>Download MyStore</title>
  <link rel="icon" type="image/png" href="assets/icon.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="card">
    <div class="logo"><img src="assets/icon.png" alt="MyStore" /></div>
    <h1>MyStore</h1>
    <p class="tagline">Your neighbourhood kirana store, delivered.</p>

    <div class="version-badge" id="versionBadge">
      <span class="dot"></span>

      <span class="spinner" id="btnSpinner"></span>
      <span id="btnText">Please wait…</span>

    <p class="error" id="errorMsg" style="display: none;"></p>
    <div class="meta" id="meta"></div>

    <div class="links">
      <a href="privacy.html">Privacy Policy</a>
      <span>·</span>
      <a href="https://github.com/YOUR_USERNAME/mystore-releases" target="_blank">All Releases</a>

  <script src="js/app.js"></script>

</html>
